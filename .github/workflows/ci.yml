# The gates, on the three things they can disagree about: the operating system, the Node
# version, and how git wrote the files out.
#
# The twin of `bitbucket-pipelines.yml`, and deliberately not a translation. Bitbucket hosts
# Linux Docker and nothing else -- Windows there needs a self-hosted runner nobody has
# attached -- so that file answers "does it work on Linux" and this one answers "does it work
# anywhere". The release step stays on Bitbucket, because that is where the archive is
# published; this file never publishes anything.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the other's answer -- that is the whole point of
      # running both.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      # BEFORE the checkout, and that is not a detail. Git for Windows rewrites line endings
      # on checkout by default; the packer hashes the bytes it reads off disk, so a CRLF
      # checkout would produce a different archive from the same commit. Unlike Bitbucket,
      # where the clone happens before any script can run, here there is a place to say so.
      - name: Leave line endings as they were committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Recorded on purpose: when a platform-only failure turns up, the first question is
      # always which versions it was.
      - run: node --version && npm --version

      - run: npm ci

      # Granular rather than one command: when this goes red, the line that failed is the
      # diagnosis. The order matches `bitbucket-pipelines.yml` and CLAUDE.md's first
      # Definition-of-Done item; `validate` comes after `build` because it reads
      # `manifest.main`, which the build produces.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate

      # The archive is built here but never published: what is being checked is that it can
      # be built at all on this platform, and that the host's own zip reader opens it.
      - run: npm run pack:nimext
      - run: npm run validate:pack

      # The archive itself, not just its checksum: when two platforms disagree, the next
      # question is always WHICH entry differs, and only the archives can answer it.
      - name: Keep this platform's archive for comparison
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.os }}-node${{ matrix.node }}
          path: release/*
          if-no-files-found: error

  # The packer claims the archive is deterministic -- fixed entry timestamps, fixed modes --
  # which is what makes "is this the file CI built?" a question `shasum -c` can answer. A
  # claim nothing checks is a claim that quietly stops being true, and the way it stops being
  # true is a file whose bytes differ per platform.
  same-archive-everywhere:
    name: The archive is byte-identical on every platform
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: archives

      - name: Compare the archives entry by entry
        shell: bash
        run: |
          set -uo pipefail

          # Per-entry hashes for every platform's archive, so a mismatch names the file that
          # differs rather than only the total.
          for dir in archives/*/; do
            name=$(basename "$dir")
            mkdir -p "unpacked/$name"
            unzip -q -o "$dir"/*.nimext -d "unpacked/$name"
            (cd "unpacked/$name" && find . -type f | sort | xargs shasum -a 256) > "listing-$name.txt"
          done

          echo "== whole-archive checksums =="
          for file in archives/*/*.sha256; do
            printf '%s  %s\n' "$(awk '{print $1}' "$file")" "$(basename "$(dirname "$file")")"
          done

          first=$(ls listing-*.txt | head -1)
          status=0
          for listing in listing-*.txt; do
            if ! diff -q "$first" "$listing" >/dev/null; then
              status=1
              echo
              echo "== $listing differs from $first =="
              diff "$first" "$listing" || true
            fi
          done

          echo
          if [ "$status" -ne 0 ]; then
            echo "The same commit produced different archives on different platforms."
            exit 1
          fi
          echo "Every platform built the same archive."
